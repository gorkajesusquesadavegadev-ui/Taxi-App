<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CanaryCab · Próximamente</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="CanaryCab — próximamente." />
<meta name="theme-color" content="#0B2E4F" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B2E4F'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23FFC400' font-family='Arial' font-weight='900'%3EC%3C/text%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 120% at 50% 0%, #10456f 0%, #0B2E4F 55%, #071f37 100%);
    color: #F7FBFE;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }
  .sun {
    position: fixed; top: -80px; right: -80px;
    width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, #FFC40055 0%, #FFC40000 70%);
    pointer-events: none;
  }
  .wrap { position: relative; max-width: 30rem; }
  .badge {
    display: inline-block;
    font-size: 11px; letter-spacing: .22em; font-weight: 800;
    text-transform: uppercase; color: #FFC400;
    border: 1px solid #FFC40055; border-radius: 999px;
    padding: 6px 14px; margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(2.6rem, 12vw, 4.4rem);
    font-weight: 900; letter-spacing: -1.5px; line-height: 1;
  }
  h1 .taxi { color: #FFC400; }
  .soon {
    margin-top: 18px;
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    font-weight: 700; color: #F7FBFE;
  }
  p.lead {
    margin-top: 14px; font-size: 1rem; line-height: 1.6;
    color: #F7FBFEb0;
  }
  .rule {
    width: 46px; height: 4px; border-radius: 2px;
    background: #FFC400; margin: 30px auto 0;
  }
  footer {
    position: fixed; bottom: 18px; left: 0; right: 0;
    font-size: 12px; color: #F7FBFE55;
  }
  .dots span {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #FFC400; margin: 0 4px; opacity: .3;
    animation: blink 1.4s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="wrap">
    <span class="badge">Islas Canarias</span>
    <h1>Canary<span class="taxi">Cab</span></h1>
    <p class="soon">Próximamente</p>
    <p class="lead">Estamos preparando algo mejor.<br/>Vuelve pronto.</p>
    <div class="rule"></div>
    <p class="dots" style="margin-top:26px" aria-hidden="true"><span></span><span></span><span></span></p>
  </div>
  <footer>© CanaryCab</footer>
</body>
</html>
