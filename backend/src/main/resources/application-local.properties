# Local profile: run the whole backend without Docker.
# H2 in-memory replaces Postgres; embedded Redis (EmbeddedRedisConfig) replaces the Redis container.
spring.datasource.url=jdbc:h2:mem:taya;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
