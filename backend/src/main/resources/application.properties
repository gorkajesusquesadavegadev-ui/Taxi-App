server.port=${PORT:8080}
# El mensaje de error lo escribe ErroresApi, no Spring. Con include-message
# se colaban a la pantalla los textos internos de las excepciones
# («JSON parse error…», «must not be blank»).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
# BD y Redis configurables por entorno (producción) con defaults de local
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/taya_taxi}
spring.datasource.username=${DB_USERNAME:taya_user}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
jwt.secret=${JWT_SECRET:devSecretChangeMeToA32+ByteRandomValue000}
jwt.expiration=43200000
# "Continuar con Google": Client ID de OAuth (console.cloud.google.com). Vacío
# en local por defecto -> /auth/google responde 503 en vez de romper el arranque.
google.client-id=${GOOGLE_CLIENT_ID:}
# Router de rutas: instancia propia (servicio "osrm" de Railway, ver osrm/Dockerfile).
# Sin OSRM_URL cae al servidor público de demostración, que no tiene garantías.
osrm.url=${OSRM_URL:https://router.project-osrm.org}
# orígenes web permitidos (CORS); en producción: la URL de tu web
taya.cors.origins=${CORS_ORIGINS:*}
# Web Push (VAPID). Sin valor por defecto A PROPOSITO: una clave privada
# escrita en el codigo es una credencial en el repositorio, aunque el
# repositorio sea privado y aunque produccion la sobreescriba. Se define por
# variable de entorno (Railway) o el push queda desactivado en local.
push.vapid.public=${VAPID_PUBLIC:}
push.vapid.private=${VAPID_PRIVATE:}
push.vapid.subject=${VAPID_SUBJECT:mailto:gorkajesusquesadavegadev@gmail.com}
# Monitorización (Actuator): solo el estado, en público; el resto cerrado.
# Solo el estado, sin detalles. Con show-details=always, /actuator/health
# publicaba SIN autenticar la version de Redis, el motor de base de datos y
# rutas y tamaños de disco del contenedor: justo lo que se usa para cruzar un
# despliegue con vulnerabilidades conocidas. Railway solo necesita el "UP".
# /actuator/info se retira: devolvia {} y no lo usa nadie.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true

# Detras del proxy de Railway la peticion llega como HTTP plano, asi que
# request.isSecure() era false y Spring Security NO emitia la cabecera HSTS
# aunque estuviera configurada. Con esto se respeta X-Forwarded-Proto.
server.forward-headers-strategy=framework
info.app.name=CanaryCab
info.app.version=1.0
